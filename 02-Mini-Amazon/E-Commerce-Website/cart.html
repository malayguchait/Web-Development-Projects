<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopEasy | Shopping Cart</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <a
            href="index.html"
            class="logo"
        >
            ShopEasy
        </a>


        <div class="cart-header-title">

            🛒 Your Shopping Cart

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Continue Shopping
        </a>

    </header>


    <!-- CART -->

    <main class="cart-page">

        <div
            id="cartContainer"
            class="cart-container"
        >
        </div>


        <aside
            id="cartSummary"
            class="cart-summary"
        >
        </aside>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            ShopEasy
        </div>

        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>

    </footer>


    <script src="cart.js"></script>

</body>

</html>
